# fly.toml — Safety Warrior K3 Dashboard
# Dibuat untuk Fly.io free tier (shared-cpu-1x, 256MB RAM)

app = "safety-warrior"
primary_region = "sin"  # Singapore — terdekat untuk Indonesia

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "error"
  DB_CONNECTION = "sqlite"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "safety_warrior_data"
  destination = "/data"
  initial_size = "1gb"

[deploy]
  release_command = ""
